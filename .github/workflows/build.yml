name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"

      # The keystore in the repo is encrypted with a long random passphrase (secret MANDAT_SIGNING_PASS);
      # its own password is a different secret (MANDAT_STORE_PASS). Pull requests never get the key.
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          PASS: ${{ secrets.MANDAT_SIGNING_PASS }}
          STORE: ${{ secrets.MANDAT_STORE_PASS }}
        run: |
          if [ -n "$PASS" ] && [ -n "$STORE" ]; then
            printf %s "$PASS" > "$RUNNER_TEMP/p"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/mandat.jks.enc -out "$RUNNER_TEMP/mandat.jks" -pass file:"$RUNNER_TEMP/p"
            rm "$RUNNER_TEMP/p"
            echo "MANDAT_KEYSTORE=$RUNNER_TEMP/mandat.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set; the APK is signed with a temporary key and not published."
          fi

      - name: Test and build
        env:
          VERSION_CODE: ${{ github.run_number }}
          MANDAT_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MANDAT_STORE_PASS || '' }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/mandat.jks"

      - name: Save build log for review
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong" -A3 "$GITHUB_WORKSPACE/build.log" | head -300; echo ----; tail -150 "$GITHUB_WORKSPACE/build.log"; } > build.log || true
          find "$GITHUB_WORKSPACE/app/build/test-results" -name "*.xml" -exec cp {} . \; 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Check permissions (no internet, only what is expected)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          # Every permission must be on this short list; anything else stops the build
          ALLOWED="android.permission.USE_BIOMETRIC android.permission.USE_FINGERPRINT ua.mandat.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for p in $(grep -oE "name='[^']+'" permissions.txt | sed "s/name='//;s/'//"); do
            case " $ALLOWED " in
              *" $p "*) ;;
              *) echo "::error::Unexpected permission: $p"; exit 1 ;;
            esac
          done

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mandat-0.1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mandat-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.MANDAT_KEYSTORE != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Mandat 0.1.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
          body: |
            **Тестова версія.** Завантажте .apk нижче на телефоні й відкрийте його, або додайте репозиторій в Obtainium. Не для відомостей з грифом.

            **Test version.** Download the .apk below on your phone and open it, or add this repository to Obtainium. Not for classified information.
