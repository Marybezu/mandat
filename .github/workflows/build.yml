name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below
permissions:
  contents: read

jobs:
  # Tests (with the screen checks, which download extra Android code). Kept apart from the APK
  # build, so nothing the tests run can touch what is published. No secrets, no write access.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle itself is checked against a fixed checksum before it runs
      - name: Install Gradle (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          V=8.14.3
          SHA=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip"
          echo "$SHA  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$V/bin" >> "$GITHUB_PATH"

      # Only caching, and only read here: nothing the tests run can change what the APK build uses
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest 2>&1 | tee test.log

      - name: Prepare test log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          { echo "tests ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 test.log | head -300; echo ----; tail -80 test.log; } > log/test.log || true
          find app/build/test-results -name "*.xml" -exec cp {} log/ \; 2>/dev/null || true
          # Room's exported database layout, to check migrations against it
          cp -r app/schemas log/schemas 2>/dev/null || true
          # Pictures of the screens drawn with neutral test data, for review
          cp -r app/build/screens log/screens 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-log
          path: log/

  # Builds the unsigned APK in a fresh machine, without running any tests. No secrets, no write access.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle itself is checked against a fixed checksum before it runs
      - name: Install Gradle (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          V=8.14.3
          SHA=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip"
          echo "$SHA  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$V/bin" >> "$GITHUB_PATH"

      # Only caching; the Gradle used is the one checked above
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build (unsigned)
        env:
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Check permissions (no internet, only what is expected)
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | tee permissions.txt
          # An empty or unreadable listing must stop the build, never pass as "nothing found"
          grep -q "^package:" permissions.txt || { echo "::error::Could not read the permissions"; exit 1; }
          # Every permission must be on this short list; anything else stops the build
          ALLOWED="android.permission.USE_BIOMETRIC android.permission.USE_FINGERPRINT android.permission.POST_NOTIFICATIONS android.permission.RECEIVE_BOOT_COMPLETED android.permission.READ_CALENDAR android.permission.HIDE_OVERLAY_WINDOWS ua.mandat.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          for p in $(grep -oE "name='[^']+'" permissions.txt | sed "s/name='//;s/'//"); do
            case " $ALLOWED " in
              *" $p "*) ;;
              *) echo "::error::Unexpected permission: $p"; exit 1 ;;
            esac
          done

      - name: Prepare build log
        if: always()
        shell: bash
        run: |
          mkdir -p log
          # What the APK carries besides code (assets), to check that nothing is missing or renamed
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk 'assets/*' > log/assets.txt 2>&1 || true
          { echo "run ${{ github.run_number }} ${{ job.status }}"; grep -E "^e: |error:|FAILED|What went wrong|Dependency verification" -A3 build.log | head -300; echo ----; tail -150 build.log; } > log/build.log || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-log
          path: log/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mandat-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  # Saves the build log to the ci-logs branch. Runs no project code.
  logs:
    needs: [test, build]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: build-log
          path: log
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: test-log
          path: log
      - name: Push the log
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd log
          git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ci-logs

  # Signs and publishes. Only for main, only in the "release" environment, and with no Gradle
  # or other third-party build code: just the Android SDK's own apksigner.
  release:
    # Published only when the tests passed too
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check that signing secrets exist
        id: secrets
        env:
          PASS: ${{ secrets.MANDAT_SIGNING_PASS }}
          STORE: ${{ secrets.MANDAT_STORE_PASS }}
        run: |
          if [ -n "$PASS" ] && [ -n "$STORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are not set; nothing is published."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          sparse-checkout: signing

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: mandat-unsigned
          path: unsigned

      - name: Sign
        if: steps.secrets.outputs.ready == 'true'
        env:
          PASS: ${{ secrets.MANDAT_SIGNING_PASS }}
          STORE: ${{ secrets.MANDAT_STORE_PASS }}
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf %s "$PASS" > "$RUNNER_TEMP/p"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/mandat.jks.enc -out "$RUNNER_TEMP/mandat.jks" -pass file:"$RUNNER_TEMP/p"
          rm "$RUNNER_TEMP/p"
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          OUT="out/mandat-0.1.${{ github.run_number }}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/mandat.jks" --ks-key-alias mandat \
            --ks-pass env:STORE --key-pass env:STORE --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/mandat.jks"
          # The certificate must be exactly Mandat's own
          "$BT/apksigner" verify --print-certs "$OUT" | tee certs.txt
          if ! tr -d ' ' < certs.txt | grep -qi "SHA-256digest:a7065316672ac15bc387a68c2ea296ec8ea279420913d69ec50205bb548d773e"; then
            echo "::error::Unexpected signing certificate"; exit 1
          fi

      - name: Remove the decrypted key
        if: always()
        run: rm -f "$RUNNER_TEMP/mandat.jks" "$RUNNER_TEMP/p"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: mandat-signed
          path: out/*.apk

  # Publishes the signed APK. Never sees the signing key; uses only GitHub's own gh tool.
  publish:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mandat-signed
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The SHA-256 of the APK, so anyone can check the file they downloaded is this one
          SUM=$(cd out && sha256sum *.apk)
          cat > notes.md <<'NOTES'
          **Тестова версія.** Завантажте .apk нижче на телефоні й відкрийте його, або додайте репозиторій в Obtainium. Не для відомостей з грифом.

          **Test version.** Download the .apk below on your phone and open it, or add this repository to Obtainium. Not for classified information.
          NOTES
          printf '\nSHA-256:\n```\n%s\n```\n' "$SUM" >> notes.md
          gh release create "v0.1.${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Mandat 0.1.${{ github.run_number }}" --notes-file notes.md --latest
