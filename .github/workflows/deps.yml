name: Refresh dependency checksums

# Run by hand (or by pushing the deps-refresh branch) after changing dependencies.
# Writes gradle/verification-metadata.xml to the deps-metadata branch for review;
# it is copied into main only after a person or the assistant has looked at it.
on:
  workflow_dispatch:
  push:
    branches: [deps-refresh]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
      - name: Write checksums
        run: |
          rm -f gradle/verification-metadata.xml
          gradle --no-daemon --write-verification-metadata sha256 testReleaseUnitTest assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-metadata
          path: out
      - name: Push for review
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q && git checkout -q -b deps-metadata && git add . && git -c user.name=ci -c user.email=ci@localhost commit -qm "verification metadata ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" deps-metadata
